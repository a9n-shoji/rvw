minimumReleaseAge: 4320
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
trustPolicyExclude:
  - "@pierre/theme@2.0.0"
trustLockfile: false
blockExoticSubdeps: true
strictDepBuilds: true
verifyDepsBeforeRun: error

overrides:
  "mermaid@11>katex": 0.18.2
  "minimatch@<11.0.1": 11.0.1

allowBuilds:
  esbuild@0.28.1: true
  tree-sitter-ruby@0.23.1: false
  tree-sitter-javascript@0.25.0: false
  tree-sitter-javascript@0.23.1: false
  tree-sitter-typescript@0.23.2: false

patchedDependencies:
  "@pierre/diffs@1.3.5": patches/@pierre__diffs@1.3.5.patch
